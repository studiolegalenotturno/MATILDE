          html{scroll-behavior:smooth} body{background:var(--ivory);color:var(--navy);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}
          nav{position:fixed;top:0;left:0;right:0;z-index:120;display:flex;align-items:center;justify-content:space-between;padding:0 56px;height:76px;background:rgba(243,239,232,.9);backdrop-filter:blur(14px);border-bottom:.5px solid rgba(176,138,74,.18)}
          .logo-wrap{display:flex;align-items:center;text-decoration:none}.logo-image-wrap,.site-logo{height:52px}.site-logo{width:auto;display:block;object-fit:contain}
          .nav-links{display:flex;gap:28px;list-style:none}.nav-links a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--navy);text-decoration:none;font-weight:500;opacity:.68;transition:.2s}.nav-links a:hover,.nav-links a.active{opacity:1;color:var(--brass)}
          .language-switch{display:flex;align-items:center;gap:6px;border:.5px solid rgba(176,138,74,.45);padding:5px 10px}.lang-btn{border:0;background:transparent;font-family:var(--sans);font-size:11px;letter-spacing:.14em;color:var(--greige);cursor:pointer;font-weight:500}.lang-btn.active,.lang-btn:hover{color:var(--brass)}.lang-separator{font-size:10px;color:rgba(139,132,124,.45)}
          .mobile-menu-toggle{display:none;width:42px;height:42px;border:.5px solid rgba(176,138,74,.45);background:rgba(243,239,232,.42);align-items:center;justify-content:center;flex-direction:column;gap:5px;cursor:pointer}.mobile-menu-toggle span{width:19px;height:1px;background:var(--navy)}
          .mobile-menu{position:fixed;top:74px;left:0;right:0;z-index:110;background:rgba(243,239,232,.99);padding:26px 28px 30px;display:none;flex-direction:column;box-shadow:0 24px 50px rgba(14,26,43,.12)}.mobile-menu.open{display:flex}.mobile-menu a{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--navy);text-decoration:none;font-weight:500;padding:16px 0;border-bottom:.5px solid rgba(176,138,74,.18)}.mobile-menu a.active{color:var(--brass)}.mobile-menu-language{margin-top:22px;display:flex;gap:8px;align-items:center}
          .hero{padding-top:76px;min-height:76vh;background:radial-gradient(circle at 78% 25%,rgba(176,138,74,.18),transparent 32%),linear-gradient(135deg,#0E1A2B,#08111F);color:var(--ivory);display:flex;align-items:center;position:relative;overflow:hidden}.hero::after{content:"";position:absolute;inset:76px 0 0;background:repeating-linear-gradient(45deg,transparent,transparent 100px,rgba(201,169,110,.035) 100px,rgba(201,169,110,.035) 101px);pointer-events:none}.hero-inner{position:relative;z-index:2;max-width:1220px;width:100%;margin:auto;padding:100px 56px}.eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--brass-light);font-weight:500;margin-bottom:22px}.hero h1{font-family:var(--serif);font-size:clamp(52px,6vw,94px);font-weight:300;line-height:1.01;max-width:900px;letter-spacing:-.02em}.hero h1 em{color:var(--brass-light);font-style:italic}.hero p{margin-top:30px;max-width:720px;font-size:15px;line-height:1.9;color:rgba(243,239,232,.74)}
          .actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:38px}.btn-primary,.btn-outline{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;padding:15px 30px;transition:.22s}.btn-primary{background:var(--brass-light);color:var(--navy-deep);border:.5px solid var(--brass-light)}.btn-primary:hover{background:var(--ivory);border-color:var(--ivory)}.btn-outline{color:var(--ivory);border:.5px solid rgba(201,169,110,.55)}.btn-outline:hover{background:var(--ivory);color:var(--navy)}
          .intro{padding:92px 56px;background:var(--ivory-light)}.wrap{max-width:1220px;margin:auto}.section-head{max-width:820px;margin-bottom:44px}.section-label{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--brass);font-weight:500;margin-bottom:16px}.section-head h2{font-family:var(--serif);font-size:clamp(38px,4vw,62px);font-weight:300;line-height:1.08;margin-bottom:18px}.section-head p{font-size:14px;line-height:1.85;color:rgba(14,26,43,.68)}
          .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.card{padding:38px;border:.5px solid rgba(176,138,74,.28);background:rgba(243,239,232,.58);min-height:260px}.card.dark{background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:var(--ivory)}.card .tag{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);font-weight:500}.card.dark .tag{color:var(--brass-light)}.card h3{font-family:var(--serif);font-size:38px;font-weight:300;margin:18px 0 14px}.card p{font-size:13.5px;line-height:1.78;color:rgba(14,26,43,.68)}.card.dark p{color:rgba(243,239,232,.68)}
          .process{padding:92px 56px;background:var(--ivory)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.step{padding:28px 26px;border-top:1px solid var(--brass);background:rgba(248,244,236,.55)}.step-num{font-family:var(--serif);font-size:38px;color:var(--brass);margin-bottom:16px}.step h3{font-size:11px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:10px}.step p{font-size:12.5px;line-height:1.7;color:rgba(14,26,43,.65)}
          .collab{padding:86px 56px;background:radial-gradient(circle at 85% 30%,rgba(176,138,74,.14),transparent 30%),linear-gradient(135deg,#0E1A2B,#08111F);color:var(--ivory)}.collab-grid{max-width:1220px;margin:auto;display:grid;grid-template-columns:1.2fr .8fr;gap:70px;align-items:center}.collab h2{font-family:var(--serif);font-size:clamp(40px,4vw,64px);font-weight:300;line-height:1.08}.collab p{margin-top:20px;font-size:14px;line-height:1.85;color:rgba(243,239,232,.7)}.privacy-note{border:.5px solid rgba(201,169,110,.35);padding:30px;background:rgba(243,239,232,.04)}.privacy-note strong{display:block;color:var(--brass-light);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}.privacy-note p{margin:0;font-size:12.5px}
          .final-cta{padding:70px 56px;background:var(--ivory-light);text-align:center}.final-cta h2{font-family:var(--serif);font-size:clamp(38px,4vw,62px);font-weight:300}.final-cta p{max-width:700px;margin:18px auto 0;font-size:14px;line-height:1.8;color:var(--greige)}.final-cta .actions{justify-content:center}.final-cta .btn-outline{color:var(--navy);border-color:rgba(176,138,74,.55)}
          footer{background:#08111F;padding:56px 56px 34px;color:var(--ivory)}.footer-grid{display:grid;grid-template-columns:1.2fr .8fr .8fr 1fr;gap:56px;max-width:1220px;margin:0 auto 44px}.footer-logo{font-family:var(--serif);font-size:42px;letter-spacing:.12em;line-height:.95;margin-bottom:20px}.footer-logo span{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.34em;color:var(--brass-light);margin-top:8px}.footer-text,.footer-contact p{font-size:13px;line-height:1.75;color:rgba(243,239,232,.62)}.footer-title{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass-light);margin-bottom:18px;font-weight:500}.footer-links{list-style:none}.footer-links li{margin-bottom:10px}.footer-links a,.footer-contact a{color:rgba(243,239,232,.66);font-size:13px;text-decoration:none}.footer-links a:hover,.footer-contact a:hover{color:var(--brass-light)}.footer-bottom{max-width:1220px;margin:auto;padding-top:24px;border-top:.5px solid rgba(176,138,74,.22);display:flex;justify-content:space-between;gap:20px}.footer-copy,.footer-policy a{font-size:11px;color:rgba(243,239,232,.4);text-decoration:none}.footer-policy{display:flex;gap:28px}
          @media(max-width:1050px){.cards{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.collab-grid{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr 1fr}.nav-links{gap:18px}}
          @media(max-width:900px){body.menu-open{overflow:hidden}nav{padding:0 24px;height:74px}.site-logo,.logo-image-wrap{height:48px}.nav-links,nav>.language-switch{display:none}.mobile-menu-toggle{display:flex}.hero{padding-top:74px}.hero-inner{padding:88px 28px 74px}.intro,.process,.collab,.final-cta{padding-left:28px;padding-right:28px}.footer-grid{grid-template-columns:1fr}footer{padding:46px 28px 30px}.footer-bottom{flex-direction:column;align-items:flex-start}}
          @media(max-width:600px){nav{padding:0 18px}.site-logo,.logo-image-wrap{height:44px}.mobile-menu{padding:22px}.hero-inner{padding:78px 22px 64px}.hero h1{font-size:43px}.intro,.process,.collab,.final-cta{padding-left:22px;padding-right:22px}.steps{grid-template-columns:1fr}.card{padding:30px 24px}.actions{flex-direction:column}.btn-primary,.btn-outline{width:100%}.footer-policy{flex-direction:column;gap:10px}}
