name: Integrate KTS Private Market

on:
  push:
    branches:
      - feature/kts-private-market

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kts-private-market

      - name: Update navigation and create Private Market page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [
              'index.html','about.html','attivita.html','approccio.html',
              'studio.html','lavora-con-noi.html','contatti.html',
              'privacy-policy.html','cookie-policy.html'
          ]

          for filename in pages:
              p = Path(filename)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')

              # Keep the seven-item desktop navigation comfortable at standard widths.
              text = re.sub(r'(\.nav-links\{\s*display:flex;\s*)gap:40px;', r'\1gap:28px;', text, count=1)

              # Desktop navigation: insert before Contacts.
              desktop = '    <li><a href="contatti.html"'
              if '    <li><a href="private-market.html"' not in text and desktop in text:
                  text = text.replace(
                      desktop,
                      '    <li><a href="private-market.html" style="color:var(--brass);opacity:1">KTS Private Market</a></li>\n' + desktop,
                      1
                  )

              # Mobile navigation: insert before Contacts.
              mobile = '  <a href="contatti.html"'
              if '  <a href="private-market.html"' not in text and mobile in text:
                  text = text.replace(
                      mobile,
                      '  <a href="private-market.html" style="color:var(--brass)">KTS Private Market</a>\n' + mobile,
                      1
                  )

              # Footer navigation: insert before Contacts.
              footer = '        <li><a href="contatti.html"'
              if '        <li><a href="private-market.html"' not in text and footer in text:
                  text = text.replace(
                      footer,
                      '        <li><a href="private-market.html">KTS Private Market</a></li>\n' + footer,
                      1
                  )

              p.write_text(text, encoding='utf-8')

          private_market = r'''<!DOCTYPE html>
          <html lang="it">
          <head>
