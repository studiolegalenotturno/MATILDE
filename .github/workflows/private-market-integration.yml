          <header class="hero"><div class="hero-inner"><p class="eyebrow" data-i18n="heroEyebrow">KTS Private Market · Accesso riservato</p><h1 data-i18n="heroTitle">Opportunità <em>riservate</em>. Origination qualificata.</h1><p data-i18n="heroText">Uno spazio riservato per opportunità Real Estate e M&A selezionate da KTS. Offerte e richieste vengono condivise in modalità blind, con accesso alle informazioni ulteriori gestito direttamente da KTS.</p><div class="actions"><a href="https://kts-deal-os.vercel.app/" class="btn-primary" data-i18n="accessButton">Accedi al Private Market →</a><a href="https://kts-deal-os.vercel.app/" class="btn-outline" data-i18n="registerButton">Registrati</a></div></div></header>

          <section class="intro"><div class="wrap"><div class="section-head"><p class="section-label" data-i18n="whatLabel">Il Private Market KTS</p><h2 data-i18n="whatTitle">Offerte e richieste, senza esporre informazioni sensibili.</h2><p data-i18n="whatText">Il Private Market mette in relazione opportunità in vendita e fabbisogni di acquisto. Le informazioni identificative, le fonti e i soggetti coinvolti restano riservati finché KTS non autorizza un livello di disclosure successivo.</p></div><div class="cards"><article class="card dark"><span class="tag" data-i18n="offerTag">Offerte</span><h3 data-i18n="offerTitle">Real Estate e M&A disponibili</h3><p data-i18n="offerText">Immobili, strutture ricettive, asset e società disponibili alla vendita o a operazioni straordinarie, presentati con informazioni blind selezionate da KTS.</p></article><article class="card"><span class="tag" data-i18n="requestTag">Richieste</span><h3 data-i18n="requestTitle">Buyer e acquirenti in ricerca</h3><p data-i18n="requestText">Mandati e ricerche qualificate di investitori, family office, gruppi industriali e altri operatori interessati ad acquisizioni Real Estate o M&A.</p></article></div></div></section>

          <section class="process"><div class="wrap"><div class="section-head"><p class="section-label" data-i18n="processLabel">Come funziona</p><h2 data-i18n="processTitle">Accesso controllato, informazioni progressive.</h2></div><div class="steps"><article class="step"><div class="step-num">01</div><h3 data-i18n="step1Title">Registrazione</h3><p data-i18n="step1Text">L’utente crea il proprio profilo e accede all’area riservata.</p></article><article class="step"><div class="step-num">02</div><h3 data-i18n="step2Title">Vista blind</h3><p data-i18n="step2Text">Le opportunità pubblicate da KTS sono consultabili senza dati identificativi o origine.</p></article><article class="step"><div class="step-num">03</div><h3 data-i18n="step3Title">Richiesta informazioni</h3><p data-i18n="step3Text">L’interesse viene inviato a KTS, che valuta profilo e livello di accesso successivo.</p></article><article class="step"><div class="step-num">04</div><h3 data-i18n="step4Title">Disclosure progressiva</h3><p data-i18n="step4Text">Teaser, NDA e documentazione vengono condivisi solo quando appropriato e autorizzato.</p></article></div></div></section>

          <section class="collab"><div class="collab-grid"><div><p class="eyebrow" data-i18n="collabLabel">Per i Collaboratori KTS</p><h2 data-i18n="collabTitle">Puoi portare sia chi vende sia chi compra.</h2><p data-i18n="collabText">I Collaboratori possono segnalare offerte e richieste, Real Estate o M&A. Il caricamento resta completo nella loro area; KTS riceve l’intero fascicolo, verifica l’opportunità e decide quali informazioni rendere visibili in blind al network.</p><div class="actions"><a href="https://kts-deal-os.vercel.app/" class="btn-primary" data-i18n="collabButton">Entra nella piattaforma →</a></div></div><div class="privacy-note"><strong data-i18n="privacyTitle">Riservatezza by design</strong><p data-i18n="privacyText">Fonte, proprietario, segnalatore, contatti e dati interni non vengono pubblicati automaticamente. KTS governa la disclosure e autorizza ogni passaggio informativo.</p></div></div></section>

