name: KTS Site Audit Checks
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check site JavaScript
        run: |
          node --check assets/kts-cookie-consent.js
          node --check assets/kts-contact-form.js
          node --input-type=module --check < api/contact.js
      - name: Run static and API unit tests
        run: node --test tests/contact.test.mjs
      - name: Validate sitemap XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: ''
      - name: Install pinned browser test dependency
        run: npm install --prefix .ci-deps --no-package-lock --no-save --ignore-scripts playwright@1.65.1
      - name: Install test Chromium
        run: ./.ci-deps/node_modules/.bin/playwright install chromium --with-deps
      - name: Browser consent, language and form checks
        run: node --test tests/browser.test.mjs
