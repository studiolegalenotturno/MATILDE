name: KTS Site Audit Checks
on:
  push:
    branches:
      - audit/kts-site-20261122
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check site JavaScript
        run: |
          node --check assets/kts-cookie-consent.js
          node --check assets/kts-contact-form.js
          node --experimental-default-type=module --check api/contact.js
      - name: Run static and API unit tests
        run: node --experimental-default-type=module --test tests/contact.test.mjs
      - name: Validate sitemap XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
